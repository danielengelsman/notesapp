<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_base.css"><style>
body { background: radial-gradient(ellipse at 50% 30%, #24352C, #141F19 70%); }
.letter { width: 620px; background: var(--cream); border-radius: 6px; padding: 44px 52px;
  box-shadow: 0 30px 80px rgba(0,0,0,.5); transform: rotate(-1.2deg); opacity:0;
  animation: arrive 1.1s cubic-bezier(.2,.8,.3,1) .4s forwards; }
@keyframes arrive { from { opacity:0; transform: translateY(-360px) rotate(-6deg);} to { opacity:1; transform: rotate(-1.2deg);} }
.from { font-size:15px; color:var(--slate); letter-spacing:.06em; text-transform:uppercase; }
.subject { margin-top:18px; font-size:26px; font-weight:700; color:var(--ink); }
.line { margin-top:14px; font-size:19px; color:var(--ink); opacity:0; }
.price { font-size:44px; font-weight:800; color:var(--ink); margin-top:18px; opacity:0; }
.price small { font-size:20px; font-weight:500; color:var(--slate); }
.l1 { animation: fadein .5s ease-out 2.2s forwards; }
.l2 { animation: fadein .5s ease-out 3.4s forwards; }
.stamp { position:absolute; right:34px; bottom:30px; border:4px solid var(--red); color:var(--red);
  padding:8px 16px; font-weight:800; font-size:22px; letter-spacing:.12em; transform:rotate(-12deg) scale(3);
  opacity:0; animation: stamp .28s ease-in 6.2s forwards; border-radius:6px; }
@keyframes stamp { from {opacity:0; transform:rotate(-12deg) scale(3);} to {opacity:1; transform:rotate(-12deg) scale(1);} }
.foot { margin-top:26px; font-size:15px; color:var(--slate); opacity:0; animation: fadeonly .6s ease-out 8.4s forwards; }
</style></head><body>
<div class="center">
  <div class="letter" style="position:relative">
    <div class="from">Renewal notice · Your accounting software</div>
    <div class="subject">Your subscription renews soon</div>
    <div class="line l1">QuickBooks® Desktop Pro Plus — annual price:</div>
    <div class="price l2 tab">$1,149.00 <small>/ year</small></div>
    <div class="foot">Failure to renew will limit access to your company file.</div>
    <div class="stamp">AUTO-RENEWS</div>
  </div>
</div>
</body></html>
