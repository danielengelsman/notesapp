<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_base.css"><style>
body { background: var(--paper); }
svg path { stroke-dasharray: 200; stroke-dashoffset: 200; animation: draw 1.4s ease-out forwards; }
svg path:nth-child(2){ animation-delay:.2s } svg path:nth-child(3){ animation-delay:.35s }
svg path:nth-child(4){ animation-delay:.5s } svg path:nth-child(5){ animation-delay:.8s }
@keyframes draw { to { stroke-dashoffset: 0; } }
.word { font-size:74px; font-weight:700; color:var(--ink); letter-spacing:-.02em; opacity:0; animation: fadein .7s ease-out 1.1s forwards; }
.tag { margin-top:10px; font-size:30px; color:var(--stead); opacity:0; animation: fadein .7s ease-out 1.8s forwards; }
</style></head><body>
<div class="center">
  <svg width="120" height="120" viewBox="0 0 64 64" fill="none">
    <path d="M6 30 L32 12 L58 30" stroke="#2E5E43" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M14 30 L32 18 L50 30" stroke="#2E5E43" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.55"/>
    <path d="M32 12 L32 22" stroke="#2E5E43" stroke-width="2.5" stroke-linecap="round" opacity="0.55"/>
    <path d="M12 34 V56 H52 V34" stroke="#2E5E43" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M27 56 V44 a5 5 0 0 1 10 0 V56" stroke="#2E5E43" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  </svg>
  <div class="word serif">Bookstead</div>
  <div class="tag serif">Your books, yours again.</div>
</div>
</body></html>
