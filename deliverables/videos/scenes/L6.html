<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_base.css"><style>
body { background: radial-gradient(ellipse at 50% 35%, #24352C, #141F19 75%); color:#fff; }
.vs { display:flex; gap:70px; align-items:center; }
.card { text-align:center; padding:36px 44px; border-radius:16px; opacity:0; }
.them { background:rgba(255,255,255,.06); border:1px solid rgba(255,255,255,.14); animation: fadein .7s .4s forwards; }
.us { background:var(--cream); color:var(--ink); animation: fadein .7s 1.4s forwards; box-shadow:0 24px 70px rgba(0,0,0,.45); }
.big { font-size:56px; font-weight:800; }
.them .big { color:#E58676; }
.us .big { color:var(--stead); }
.sub { margin-top:6px; font-size:20px; opacity:.85; }
.tagline { margin-top:70px; font-size:34px; opacity:0; animation: fadein .8s 3.2s forwards; }
.brand { display:flex; align-items:center; gap:14px; margin-top:26px; opacity:0; animation: fadein .8s 4.4s forwards; }
.brand span { font-size:38px; font-weight:700; }
</style></head><body>
<div class="center">
  <div class="vs tab">
    <div class="card them"><div class="big">$1,049</div><div class="sub">every year, forever</div></div>
    <div class="card us"><div class="big">$149</div><div class="sub">once. yours forever.</div></div>
  </div>
  <div class="tagline serif">The archive outlives the software.</div>
  <div class="brand">
    <svg width="46" height="46" viewBox="0 0 64 64" fill="none">
      <path d="M6 30 L32 12 L58 30" stroke="#F7F4EC" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M12 34 V56 H52 V34" stroke="#F7F4EC" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M27 56 V44 a5 5 0 0 1 10 0 V56" stroke="#F7F4EC" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
    <span class="serif">Bookstead</span>
  </div>
</div>
</body></html>
